[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsh-vision-dashscope"
version = "0.1.0"
description = "DSH 插件：通过 DashScope/Qwen 识别图片、视频、音频，大视频走临时 OSS 直传（无 base64 大小限制、不压缩画质）。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ywleeo" }]
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.0,<2.0",
  "pydantic>=2.12,<3",
]

[project.scripts]
dsh-vision-dashscope = "dsh_vision_dashscope.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_vision_dashscope"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["D203", "D213"]
